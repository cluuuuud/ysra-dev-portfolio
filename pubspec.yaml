name: attendance_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  table_calendar: ^3.0.9
  flutter_slidable: ^3.0.1

  # ── Database ──────────────────────────────────────────────────────────────
  sqflite: ^2.3.0
  path: ^1.9.0

  # ── File & Export ─────────────────────────────────────────────────────────
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.0.0
  path_provider: ^2.1.1
  share_plus: ^9.0.0

  # ── Preferences & Utilities ───────────────────────────────────────────────
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  intl: ^0.19.0

  # ── Network ───────────────────────────────────────────────────────────────
  http: ^1.2.0
  connectivity_plus: ^6.0.0

  # ── Google Services ───────────────────────────────────────────────────────
  google_sign_in: ^6.2.0
  googleapis: ^13.0.0
  googleapis_auth: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/database/dbv5.db